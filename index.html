<!DOCTYPE html>
<html>

<head>
    <title>
        Youtube
    </title>
    <link rel="icon" href="https://www.google.com/s2/favicons?domain=youtube.com&sz=128">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/header.css">
    <link rel="stylesheet" href="styles/video.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <style>
        .add-video-section {
            margin: 28px 24px 24px 96px;
            max-width: 1000px;
        }

        .add-video-section[hidden] {
            display: none;
        }

        .add-video-trigger {
            position: relative;
            display: grid;
            place-items: center;
            width: 40px;
            height: 40px;
            margin-left: 8px;
            border: 0;
            border-radius: 50%;
            background: #f2f2f2;
            color: #0f0f0f;
            font-size: 24px;
            cursor: pointer;
        }

        .add-video-trigger:hover {
            background: #e5e5e5;
        }

        .add-video-trigger .tooltip {
            position: absolute;
            top: 48px;
            left: 50%;
            z-index: 20;
            transform: translateX(-50%);
            padding: 8px;
            border-radius: 4px;
            background: rgba(60, 60, 60, 0.9);
            color: white;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
        }

        .add-video-trigger:hover .tooltip,
        .add-video-trigger:focus-visible .tooltip {
            opacity: 1;
        }

        #add-video-form {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 8px 12px;
            align-items: center;
            padding: 18px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        #add-video-form label {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #0f0f0f;
            font-size: 16px;
            font-weight: 700;
        }

        #add-video-form label img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        #video-url-input {
            width: 100%;
            min-height: 44px;
            box-sizing: border-box;
            padding: 0 14px;
            border: 1px solid #c7c7c7;
            border-radius: 8px;
            outline: none;
            font: inherit;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        #video-url-input:focus {
            border-color: #065fd4;
            box-shadow: 0 0 0 3px rgba(6, 95, 212, 0.14);
        }

        #add-video-form button {
            min-height: 44px;
            padding: 0 18px;
            border: 0;
            border-radius: 8px;
            background: #0f0f0f;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: background 150ms ease, transform 150ms ease;
        }

        #add-video-form button:hover {
            background: #303030;
        }

        #add-video-form button:active {
            transform: scale(0.98);
        }

        #add-video-message {
            grid-column: 1 / -1;
            min-height: 18px;
            margin: 0;
            color: #606060;
            font-size: 13px;
        }

        .video-remove-button {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border: 0;
            border-radius: 50%;
            background: rgba(15, 15, 15, 0.82);
            color: #fff;
            font-size: 24px;
            line-height: 1;
            cursor: pointer;
            opacity: 0;
            transition: opacity 150ms ease, background 150ms ease;
        }

        .thumbnail-row:hover .video-remove-button,
        .video-remove-button:focus-visible {
            opacity: 1;
        }

        .video-remove-button:hover {
            background: #c00;
        }

        .video-player-section {
            margin: 96px 24px 24px 96px;
            max-width: 1000px;
        }

        .video-player-section[hidden] {
            display: none;
        }

        /* Khi mở video, trình phát nằm bên trái và danh sách video xếp dọc bên phải. */
        main.video-playing-layout {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
            gap: 24px;
            align-items: start;
            margin: 96px 24px 24px 96px;
        }

        main.video-playing-layout .video-player-section {
            min-width: 0;
            margin: 0;
            max-width: none;
            position: sticky;
            top: 96px;
        }

        main.video-playing-layout .video-grid {
            min-width: 0;
            grid-template-columns: 1fr;
        }

        main.video-playing-layout .video-preview {
            display: grid;
            grid-template-columns: minmax(120px, 42%) minmax(0, 1fr);
            gap: 12px;
            align-items: start;
        }

        main.video-playing-layout .thumbnail-row {
            margin-bottom: 0;
        }

        @media (max-width: 900px) {
            main.video-playing-layout {
                display: block;
                margin: 88px 16px 20px;
            }

            main.video-playing-layout .video-player-section {
                position: static;
                margin-bottom: 24px;
            }
        }

        @media (max-width: 520px) {
            main.video-playing-layout .video-preview {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }

        .video-player-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        .video-player-wrap:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: none;
            aspect-ratio: auto;
        }

        .video-player-wrap:fullscreen .video-player-frame,
        .video-player-wrap:fullscreen .video-player-shield {
            width: 100%;
            height: 100%;
        }

        .video-player-frame {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        .video-player-overlay {
            position: absolute;
            z-index: 3;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 0;
            background: rgba(255, 255, 255, 0.9);
            color: #fff;
            cursor: pointer;
            font: inherit;
            font-size: 18px;
        }

        .video-player-overlay[hidden] {
            display: none;
        }

        .video-player-shield {
            position: absolute;
            z-index: 1;
            inset: 0;
            background: transparent;
        }

        .video-player-controls {
            position: absolute;
            z-index: 2;
            inset: auto 0 0;
            min-height: 58px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            opacity: 0;
            visibility: hidden;
            transition: opacity 180ms ease, visibility 180ms ease;
        }

        .video-player-wrap.controls-visible .video-player-controls {
            opacity: 1;
            visibility: visible;
        }

        /* Cảm ứng: chạm vào trình phát sẽ hiện thanh; không giữ cố định trên mobile. */
        .video-player-wrap.touch-controls-visible .video-player-controls {
            opacity: 1;
            visibility: visible;
        }

        .video-player-wrap:fullscreen .video-player-controls {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .video-player-wrap:fullscreen.controls-visible .video-player-controls {
            opacity: 1 !important;
            visibility: visible !important;
            pointer-events: auto !important;
        }

        .video-player-controls button,
        .video-player-controls select {
            min-height: 36px;
            border: 1px solid rgba(255, 255, 255, .65);
            border-radius: 4px;
            padding: 6px 10px;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            font: inherit;
            cursor: pointer;
        }

        .player-time {
            flex: none;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .video-player-controls input[type="range"] {
            flex: 1;
            min-width: 40px;
        }

        .video-player-controls[hidden] {
            display: none;
        }

        .video-player-overlay span {
            padding: 12px 20px;
            border-radius: 4px;
            background: #272727;
        }

        .video-player-title {
            margin: 12px 0 0;
            font-size: 20px;
            font-weight: 700;
        }

        @media (max-width: 750px) {
            .video-player-section {
                margin: 88px 16px 20px;
            }

            .add-video-section {
                margin: 20px 16px;
            }

            #add-video-form {
                grid-template-columns: 1fr;
                padding: 14px;
            }

            #add-video-form label,
            #add-video-message {
                grid-column: 1;
            }
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script defer src="scripts/video-player.js"></script>
</head>

<body>
    <header class="header">
        <div class="left-section">
            <img class="hamburger-logo" src="icons/hamburger-menu.svg">
            <img class="youtube-logo" src="icons/youtube-logo.svg">
        </div>
        <div class="middle-section">
            <input class="search-bar" type="text" placeholder="Search">
            <button class="search-button">
                <img class="search-icon" src="icons/search.svg">
                <div class="tooltip">Search</div>
            </button>
            <button class="voice-search-button">
                <img class="voice-search-icon" src="icons/voice-search-icon.svg">
                <div class="tooltip">Search with your voice</div>
            </button>
            <button class="add-video-trigger" id="add-video-trigger" type="button" aria-label="Thêm video YouTube"
                aria-expanded="false" aria-controls="add-video-section">
                <span aria-hidden="true">+</span>
                <span class="tooltip">Thêm video</span>
            </button>
        </div>
        <div class="right-section">
            <div class="upload-icon-container">
                <img class="upload-icon" src="icons/upload.svg">
                <div class="tooltip">Create</div>
            </div>
            <div class="youtube-apps-icon-container">
                <img class="youtube-apps-icon" src="icons/youtube-apps.svg">
                <div class="tooltip">Youtube apps</div>
            </div>
            <div class="notifications-icon-container">
                <img class="notifications-icon" src="icons/notifications.svg">
                <div class="notifications-count">3</div>
                <div class="tooltip">Notifications</div>
            </div>
            <img class="current-user-picture-icon" src="channel-pictures/my-channel.jpg">
        </div>
    </header>
    <nav class="sidebar">
        <div class="sidebar-link">
            <img src="icons/home.svg">
            <div>Home</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/explore.svg">
            <div>Explore</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/subscriptions.svg">
            <div>Subscriptions</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/originals.svg">
            <div>Originals</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/youtube-music.svg">
            <div>Youtube Music</div>
        </div>
        <div class="sidebar-link">
            <img src="icons/library.svg">
            <div>Library</div>
        </div>
    </nav>
    <main>
        <section class="video-player-section" id="video-player-section" aria-label="Video player" hidden>
            <div class="video-player-wrap" id="video-player-wrap">
                <div class="video-player-frame" id="video-player"></div>
                <div class="video-player-shield" aria-hidden="true"></div>
                <button class="video-player-overlay" id="video-player-overlay" type="button" hidden
                    aria-label="Phát lại video">
                    <span>▶ Phát lại video</span>
                </button>
                <div class="video-player-controls" id="video-player-controls" aria-label="Điều khiển video" hidden>
                    <button id="player-play-toggle" type="button" aria-label="Phát hoặc tạm dừng">▶ / ⏸</button>
                    <span class="player-time" id="player-time" aria-label="Thời gian video">0:00 / 0:00</span>
                    <input id="player-seek" type="range" min="0" max="1000" value="0" aria-label="Tua video">
                    <button id="player-mute-toggle" type="button" aria-label="Tắt/bật tiếng">🔊</button>
                    <input id="player-volume" type="range" min="0" max="100" value="100" aria-label="Âm lượng">
                    <button id="player-captions-toggle" type="button" aria-label="Bật/tắt phụ đề">CC</button>
                    <select id="player-playback-rate" aria-label="Tốc độ phát">
                        <option value="0.5">0.5×</option>
                        <option value="0.75">0.75×</option>
                        <option value="1" selected>1×</option>
                        <option value="1.25">1.25×</option>
                        <option value="1.5">1.5×</option>
                        <option value="2">2×</option>
                    </select>
                    <button id="player-fullscreen-toggle" type="button" aria-label="Toàn màn hình">⛶</button>
                </div>
            </div>
            <p class="video-player-title" id="video-player-title"></p>
        </section>
        <section class="add-video-section" id="add-video-section" aria-label="Thêm video YouTube" hidden>
            <form id="add-video-form">
                <label for="video-url-input">
                    <img src="channel-pictures/logo.png" alt="">
                    <span>Thêm link YouTube:</span>
                </label>
                <input id="video-url-input" name="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..."
                    required>
                <button type="submit">Thêm video</button>
                <p id="add-video-message" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section class="video-grid">
        </section>
    </main>
</body>

</html>
